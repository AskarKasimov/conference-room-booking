services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_TEST_RESET: ${ENABLE_TEST_RESET:-true}
      NODE_ENV: production
    ports:
      - "${SERVER_PORT:-3000}:3000"
    healthcheck:
      test: [CMD, wget, -q, -O, "-", http://127.0.0.1:3000/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000/api/v1/ws}
        VITE_REQUEST_TIMEOUT_MS: ${VITE_REQUEST_TIMEOUT_MS:-10000}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5173}:80"
