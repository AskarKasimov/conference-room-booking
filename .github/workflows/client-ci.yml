name: Client CI

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run check
